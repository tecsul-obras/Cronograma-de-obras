<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2744">
<title>Flota - Tecsul</title>
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* Mismos colores y medidas que parte_diario_v5.html: para el usuario es
   la misma app. */
:root {
  --azul-oscuro: #1a2744;
  --azul-medio: #2c4a8a;
  --naranja: #e8640a;
  --naranja-claro: #f5a847;
  --gris-fondo: #f0f2f5;
  --gris-borde: #d0d6e0;
  --gris-texto: #4a5568;
  --blanco: #ffffff;
  --verde: #2d8a4e;
  --rojo: #c0392b;
  --amarillo-alerta: #f59e0b;
  --radio: 10px;
  --sombra: 0 2px 12px rgba(26,39,68,0.12);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--gris-fondo); color: var(--azul-oscuro);
  font-size: 15px; line-height: 1.45;
}
input, select, textarea, button { font-family: inherit; font-size: 16px; }
button { cursor: pointer; }

/* ── Cabecera y navegación (igual que la app de partes) ──── */
.app-header {
  background: var(--azul-oscuro); color: #fff; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 50;
}
.app-header img { width: 32px; height: 32px; border-radius: 6px; background:#fff; }
.app-header .t { flex: 1; min-width: 0; }
.app-header .t b { display: block; font-size: 15px; }
.app-header .t span { font-size: 11.5px; color: rgba(255,255,255,.65); }
.logout-link {
  background: rgba(255,255,255,.12); border: 0; color: #fff;
  padding: 7px 11px; border-radius: 8px; font-size: 13px;
}
.nav-tabs {
  display: flex; background: var(--blanco); border-bottom: 1px solid var(--gris-borde);
  position: sticky; top: 52px; z-index: 49; overflow-x: auto;
}
.nav-tabs { scrollbar-width: none; }
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  flex: 1 0 auto; padding: 12px 10px; text-align: center; font-size: 13px; font-weight: 600;
  color: var(--gris-texto); border: 0; background: none; white-space: nowrap;
  border-bottom: 3px solid transparent; text-decoration: none;
}
.nav-tab.active { color: var(--naranja); border-bottom-color: var(--naranja); }
.nav-tab .n {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px;
  border-radius: 9px; background: var(--rojo); color: #fff; font-size: 11px;
}
.offline-banner {
  display: none; background: var(--amarillo-alerta); color: #fff;
  padding: 7px 14px; font-size: 13px; font-weight: 600; text-align: center;
}
.offline-banner.show { display: block; }

.screen { display: none; padding: 14px; padding-bottom: 90px; }
.screen.active { display: block; }
@media (min-width: 900px) { .screen { padding: 14px 24px 90px; } }

/* ── Tarjetas de resumen ─────────────────────────────────── */
.tarjetas {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 9px; margin-bottom: 12px;
}
.tarjeta {
  background: var(--blanco); border-radius: var(--radio); padding: 10px 12px;
  box-shadow: var(--sombra); border-left: 4px solid var(--azul-medio);
  text-align: left; border-top: 0; border-right: 0; border-bottom: 0;
}
.tarjeta.sel { outline: 2px solid var(--azul-medio); }
.tarjeta .n { font-size: 24px; font-weight: 700; line-height: 1.1; display: block; }
.tarjeta .t {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .3px; color: var(--gris-texto); display: block; margin-top: 2px;
}
.tarjeta.malo  { border-left-color: var(--rojo); }   .tarjeta.malo  .n { color: var(--rojo); }
.tarjeta.medio { border-left-color: var(--amarillo-alerta); } .tarjeta.medio .n { color: #b7791f; }
.tarjeta.bien  { border-left-color: var(--verde); }  .tarjeta.bien  .n { color: var(--verde); }

/* ── Filtros ─────────────────────────────────────────────── */
.filtros {
  display: flex; gap: 9px; flex-wrap: wrap; align-items: flex-end;
  background: var(--blanco); padding: 11px; border-radius: var(--radio);
  box-shadow: var(--sombra); margin-bottom: 12px;
}
.filtro { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.filtro.crece { flex: 1; min-width: 180px; }
.filtro > label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .3px; color: var(--gris-texto);
}
.filtro input, .filtro select {
  padding: 8px 10px; border: 1.5px solid var(--gris-borde);
  border-radius: 7px; font-size: 13px; background: var(--blanco); max-width: 100%;
}
.filtro.crece input { width: 100%; }
.check-linea { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 8px 0; }
.btn-filtro {
  padding: 9px 13px; border: 1.5px solid var(--gris-borde); background: var(--blanco);
  border-radius: 7px; font-size: 13px; font-weight: 600; white-space: nowrap;
}
.btn-filtro.primario { background: var(--azul-medio); color: #fff; border-color: var(--azul-medio); }
.btn-filtro.verde { background: var(--verde); color: #fff; border-color: var(--verde); }
.barra-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.barra-acciones .info { font-size: 12px; color: var(--gris-texto); flex: 1; min-width: 140px; }
.vista-toggle { display: flex; border: 1.5px solid var(--gris-borde); border-radius: 7px; overflow: hidden; }
.vista-toggle button { border: 0; background: var(--blanco); padding: 8px 11px; font-size: 13px; font-weight: 600; color: var(--gris-texto); }
.vista-toggle button.on { background: var(--azul-medio); color: #fff; }

@media (max-width: 699px) {
  .tarjetas { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 7px; }
  .tarjeta { padding: 8px 9px; }
  .tarjeta .n { font-size: 20px; }
  .tarjeta .t { font-size: 9.5px; }
  .filtros .filtro:not(.crece):not(.siempre) { display: none; }
  .filtros.abiertos .filtro { display: flex !important; }
}
@media (min-width: 700px) { .solo-movil { display: none !important; } }

/* ── Chips de estado ─────────────────────────────────────── */
.chip {
  display: inline-block; padding: 2px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 700; white-space: nowrap; line-height: 1.6;
}
.chip.Operativo, .chip.verde { background: #e3f4e9; color: var(--verde); }
.chip.Fallando, .chip.amarillo { background: #fef3dc; color: #a56a00; }
.chip.Inoperativo, .chip.rojo { background: #fde8e6; color: var(--rojo); }
.chip.gris { background: #e9edf3; color: var(--gris-texto); }
.chip.azul { background: #e0e7ff; color: var(--azul-medio); }
.chip.violeta { background: #efe5fb; color: #6b3fa0; }
.chip.celeste { background: #ddf1f8; color: #1d6f8c; }
/* Paleta para asignación / ubicación: mismo nombre → mismo color */
.chip.p0 { background: #e0e7ff; color: #2c4a8a; }
.chip.p1 { background: #ddf1f8; color: #1d6f8c; }
.chip.p2 { background: #e3f4e9; color: #2d7a46; }
.chip.p3 { background: #efe5fb; color: #6b3fa0; }
.chip.p4 { background: #fdeadf; color: #a24b17; }
.chip.p5 { background: #fbe4ef; color: #a1305f; }
.chip.p6 { background: #e2f3ef; color: #1e7565; }
.chip.p7 { background: #f3eedc; color: #7a6212; }
.chip.p8 { background: #e6ebf1; color: #44556b; }
.chip.p9 { background: #e8eddc; color: #55682a; }
.tabla td .chip { font-weight: 600; }

/* ── Lista en tarjetas (celular) ─────────────────────────── */
.equipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.eq {
  background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra);
  padding: 11px 12px; text-align: left; border: 0; border-left: 4px solid var(--gris-borde);
  display: block; width: 100%; color: inherit;
}
.eq.Operativo { border-left-color: var(--verde); }
.eq.Fallando { border-left-color: var(--amarillo-alerta); }
.eq.Inoperativo { border-left-color: var(--rojo); }
.eq.baja { opacity: .55; }
.eq .fila1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.eq .cod { font-size: 16px; font-weight: 800; }
.eq .tipo { font-size: 12.5px; color: var(--gris-texto); }
.eq .meta { font-size: 12px; color: var(--gris-texto); margin-top: 5px; }
.eq .obs { font-size: 12.5px; margin-top: 5px; color: var(--azul-oscuro); }
.eq .obs.auto { color: var(--gris-texto, #6b7487); font-size: 12px; }
.obs-auto { padding: 10px 12px; background: #f3f5f9; border-radius: 8px; font-size: 13.5px; color: #333; min-height: 40px; }
.obs-auto small { display: block; color: var(--gris-texto, #6b7487); font-size: 11.5px; margin-top: 3px; }
.eq .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }

/* ── Tabla (escritorio) ──────────────────────────────────── */
.tabla-wrap {
  width: 100%; overflow: auto; max-height: 70vh;
  border: 1px solid var(--gris-borde); border-radius: 8px; background: var(--blanco);
}
.tabla { border-collapse: collapse; font-size: 12.5px; white-space: nowrap; width: 100%; }
.tabla th {
  background: var(--azul-oscuro); color: #fff; padding: 9px 11px; text-align: left;
  font-weight: 600; position: sticky; top: 0; font-size: 11px; cursor: pointer; z-index: 2;
}
.tabla th.activo { color: var(--naranja-claro); }
.tabla td { padding: 7px 11px; border-bottom: 1px solid #eef1f5; }
.tabla td.larga { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.tabla tr:nth-child(even) td { background: #f9fafb; }
.tabla tbody tr:hover td { background: #eef4ff; cursor: pointer; }
.tabla tr.baja td { opacity: .5; }
/* v20261022c: tabla editable y selección */
.tabla th.chk, .tabla td.chk { width: 30px; padding: 7px 6px 7px 10px; cursor: default; }
.tabla th.chk input, .tabla td.chk input { width: 16px; height: 16px; cursor: pointer; }
.tabla tr.marcada td { background: #fff4e5 !important; }
.tabla td.ed { cursor: pointer; }
.tabla td.ed .lapiz { color: #9aa5b4; font-size: 10px; margin-left: 4px; visibility: hidden; }
.tabla td.ed:hover { outline: 1.5px dashed #9fb3d9; outline-offset: -3px; }
.tabla td.ed:hover .lapiz { visibility: visible; }
.tabla .sel-celda { font-size: 12.5px; padding: 4px 6px; border: 1.5px solid var(--azul-medio, #2c4a8a); border-radius: 6px; max-width: 240px; }
.barra-sel { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; background: #fff4e5;
  border: 1.5px solid #f2c48d; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 12.5px;
  position: sticky; left: 0; }
.barra-sel b { align-self: center; margin-right: 4px; }
.barra-sel label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 600; color: var(--gris-texto, #5b6575); }
.barra-sel select { font-size: 12.5px; padding: 5px 6px; border: 1px solid #cfd6e0; border-radius: 6px; max-width: 200px; }
.barra-sel.vacia { background: transparent; border: 0; padding: 0 2px; color: var(--gris-texto, #5b6575); font-size: 12px; }

/* ── Hoja (ficha del equipo) ─────────────────────────────── */
.hoja-fondo { position: fixed; inset: 0; background: rgba(26,39,68,.55); z-index: 150; display: none; }
.hoja-fondo.show { display: flex; justify-content: center; align-items: stretch; }
.hoja {
  background: var(--gris-fondo); width: 100%; max-width: 980px; display: flex;
  flex-direction: column; min-height: 0;
}
@media (min-width: 900px) {
  .hoja-fondo.show { align-items: center; padding: 24px; }
  .hoja { max-height: 92vh; border-radius: 14px; overflow: hidden; }
}
.hoja-cab {
  background: var(--azul-oscuro); color: #fff; padding: 12px 14px;
  display: flex; gap: 10px; align-items: flex-start;
}
.hoja-cab .tit { flex: 1; min-width: 0; }
.hoja-cab .tit b { font-size: 18px; display: block; }
.hoja-cab .tit span { font-size: 12.5px; color: rgba(255,255,255,.75); }
.hoja-cab .cerrar {
  background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 8px;
  padding: 8px 12px; font-size: 14px;
}
.hoja-tabs { display: flex; background: var(--blanco); overflow-x: auto; border-bottom: 1px solid var(--gris-borde); }
.hoja-tabs button {
  border: 0; background: none; padding: 11px 13px; font-size: 13px; font-weight: 600;
  color: var(--gris-texto); border-bottom: 3px solid transparent; white-space: nowrap;
}
.hoja-tabs button.on { color: var(--naranja); border-bottom-color: var(--naranja); }
.hoja-cuerpo { flex: 1; overflow-y: auto; padding: 14px; }

.card {
  background: var(--blanco); border-radius: var(--radio);
  box-shadow: var(--sombra); margin-bottom: 14px; overflow: hidden;
}
.card-header {
  background: var(--azul-medio); color: #fff; padding: 10px 14px;
  font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 8px;
}
.card-header .der { margin-left: auto; }
.card-body { padding: 14px; }

/* Datos en grilla: etiqueta arriba, valor abajo */
.datos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 16px; }
.dato .e { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: var(--gris-texto); }
.dato .v { font-size: 14px; word-break: break-word; }
.dato .v:empty::after { content: '—'; color: #9aa3b2; }

/* Formularios */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 0 14px; }
.field { margin-bottom: 12px; }
.field.ancho { grid-column: 1 / -1; }
.field > label {
  display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .3px; margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 11px; border: 1.5px solid var(--gris-borde);
  border-radius: 8px; background: var(--blanco); color: var(--azul-oscuro);
}
.field input[type=checkbox] { width: auto; }
.field textarea { min-height: 70px; resize: vertical; }
.field .ayuda { font-size: 11.5px; color: var(--gris-texto); margin-top: 4px; }
.field input:disabled, .field select:disabled, .field textarea:disabled { background: #f4f6f9; color: var(--gris-texto); }
.acciones { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.btn {
  padding: 11px 18px; border: 0; border-radius: 9px; font-weight: 700; font-size: 14.5px;
}
.btn-primario { background: var(--azul-medio); color: #fff; }
.btn-verde { background: var(--verde); color: #fff; }
.btn-gris { background: var(--gris-borde); color: var(--gris-texto); }
.btn-rojo { background: #fdeceb; color: var(--rojo); }
.btn:disabled { opacity: .5; }
.btn-mini {
  padding: 6px 11px; border: 0; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap;
}

.lista-simple { list-style: none; margin: 0; padding: 0; }
.lista-simple li { padding: 10px 0; border-bottom: 1px solid #eef1f5; display: flex; gap: 10px; align-items: flex-start; }
.lista-simple li:last-child { border-bottom: 0; }
.lista-simple .pri { flex: 1; min-width: 0; }
.lista-simple .pri b { display: block; font-size: 14px; }
.lista-simple .pri span { font-size: 12px; color: var(--gris-texto); }
.empty-state { text-align: center; padding: 30px 16px; color: var(--gris-texto); font-size: 14px; }
.aviso-caja {
  background: #fef6e7; border-left: 3px solid var(--amarillo-alerta);
  padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px;
}
.aviso-caja.rojo { background: #fdeceb; border-left-color: var(--rojo); }
.aviso-caja.verde { background: #e8f4ea; border-left-color: var(--verde); }

.cambio { font-size: 12px; color: var(--gris-texto); }
.cambio i { font-style: normal; color: var(--azul-oscuro); }

/* Alertas */
.alerta-grupo { margin-bottom: 16px; }
/* v20261027c: elegir columnas de la tabla */
.cols-caja { position: relative; }
.cols-menu { display: none; position: absolute; right: 0; top: calc(100% + 4px); z-index: 60; background: var(--blanco);
  border: 1px solid var(--gris-borde); border-radius: 10px; box-shadow: 0 10px 30px rgba(20,30,60,.2);
  padding: 6px; width: 230px; max-height: 70vh; overflow-y: auto; }
.cols-menu.show { display: block; }
.cols-menu label { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.cols-menu label:hover { background: var(--gris-fondo); }
.cols-menu label.fija { color: var(--gris-texto); cursor: default; }
.cols-menu .cols-acc { display: flex; gap: 6px; padding: 4px 6px 6px; border-bottom: 1px solid #eef1f6; margin-bottom: 4px; }
.cols-menu .cols-acc button { border: 0; background: #eef1f6; border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 600; color: var(--azul-medio); cursor: pointer; }
.btn-filtro.con-ocultas { border-color: var(--azul-medio); background: #eef2ff; }
/* v20261027a: avisos de operador y enganches */
.avisos-op { background: #fff8e6; border: 1px solid #f3d38a; border-radius: var(--radio); padding: 9px 12px;
  margin-bottom: 10px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.avisos-op b { color: #8a5a00; }
.avisos-op button { margin-left: auto; }
.alerta .btn-mini { flex: none; }
.chip.enganche { background: #eef2ff; color: var(--azul-medio); }
.enganche-lista { list-style: none; margin: 0 0 10px; padding: 0; }
.enganche-lista li { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid #eef1f6; }
.enganche-lista li .pri { flex: 1; min-width: 0; }
.enganche-lista li .pri span { display: block; font-size: 12px; color: var(--gris-texto); }
.enganche-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-top: 6px; }
.enganche-form .field { flex: 1; min-width: 200px; margin: 0; }
.alerta-grupo h3 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
.alerta {
  background: var(--blanco); border-radius: 8px; box-shadow: var(--sombra);
  padding: 10px 12px; margin-bottom: 7px; display: flex; gap: 10px; align-items: center;
  border: 0; width: 100%; text-align: left; color: inherit;
}
.alerta .pri { flex: 1; min-width: 0; }
div.alerta { cursor: pointer; }
.alerta .pri b { font-size: 14px; }
.alerta .pri span { display: block; font-size: 12px; color: var(--gris-texto); }

/* Modales chicos */
.modal { position: fixed; inset: 0; background: rgba(26,39,68,.55); z-index: 160; display: none; }
.modal.show { display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .modal.show { align-items: center; } }
.modal-card {
  background: var(--blanco); width: 100%; max-width: 640px; max-height: 88vh;
  border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
}
@media (min-width: 700px) { .modal-card { border-radius: 14px; } }
.modal-head { padding: 13px 14px; border-bottom: 1px solid var(--gris-borde); display: flex; align-items: center; gap: 10px; }
.modal-head b { flex: 1; }
.modal-body { padding: 14px; overflow-y: auto; }

/* Avisos */
.loading-overlay {
  position: fixed; inset: 0; background: rgba(26,39,68,.72); z-index: 300;
  display: none; align-items: center; justify-content: center; flex-direction: column; color: #fff;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 38px; height: 38px; border: 3px solid rgba(255,255,255,.25);
  border-top-color: var(--naranja-claro); border-radius: 50%;
  animation: giro .8s linear infinite; margin-bottom: 12px;
}
@keyframes giro { to { transform: rotate(360deg); } }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
  background: var(--azul-oscuro); color: #fff; padding: 12px 18px; border-radius: 10px;
  font-size: 14px; z-index: 400; max-width: 90vw; text-align: center;
  transition: transform .25s; box-shadow: 0 4px 18px rgba(0,0,0,.3);
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.error { background: var(--rojo); }
#toast.success { background: var(--verde); }
#toast.warning { background: var(--amarillo-alerta); }
</style>
</head>
<body>

<header class="app-header">
  <img src="./icon-192.png" alt="" onerror="this.style.display='none'">

<script>
// ══════════════════════════════════════════════════════════════════
// FLOTA — Tecsul S.A.E.
//
// Reemplaza los tableros de taller de Monday. Misma sesión y mismo
// Supabase que parte_diario_v5.html: el usuario entra una sola vez y
// pasa de una pantalla a la otra con las solapas de arriba.
//
// Quién ve qué (lo decide la base con RLS; acá solo se esconden botones):
//   admin_obra     → ve la flota y las fichas; solo cambia la disponibilidad
//                    (sin mantenimiento ni OT en la ficha)
//   taller         → edita todo
//   admin_central  → todo
//   operador       → no entra (se lo devuelve a la app de partes)
// ══════════════════════════════════════════════════════════════════

const SUPABASE_URL = localStorage.getItem('sb_url') ||
  'https://sququxlqcrbsoqvmycfa.supabase.co';
const SUPABASE_KEY = localStorage.getItem('sb_key') ||
  'sb_publishable_pN_FUHE3sbU98ReSQriUpg_zQeBko7R';
const BUCKET_DOCS = 'documentos';
const APP_PARTES = './parte_diario_v5.html';

let sb = null;
try {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    // La misma sesión que el resto de la app (un solo ingreso para todo)
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'cronograma-auth' }
  });
} catch (e) {
  alert('No se pudo iniciar la conexión.');
}

let sesion = null;
let flota = [];            // filas de v_flota
let alertas = [];
let cat = {};              // catálogos
let fichaId = null;        // equipo abierto
let fichaTab = 'estado';
let vista = null;
let orden = { col: 'id', asc: true };

const $ = (id) => document.getElementById(id);
const esTaller = () => sesion && ['taller', 'admin_central'].includes(sesion.rol);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const CATEGORIAS = {
  equipo: 'Equipo', vehiculo_liviano: 'Vehículo liviano', tanque: 'Tanque',
  contenedor: 'Contenedor', bascula: 'Báscula', otro: 'Otro'
};
const ESTADOS = ['Operativo', 'Fallando', 'Inoperativo'];
const GRUPOS = ['Producción', 'Apoyo', 'Movilidad', 'Planta', 'Irrecuperable'];
const CATEGORIAS_DOC = ['Habilitación Dinatran', 'Cédula Verde', 'Habilitación Municipal',
  'Seguro / Póliza', 'Factura / Orden de Taller', 'Foto', 'Manual / Ficha Técnica',
  'Contrato', 'Otro'];
const TIPOS_MANT = ['Preventivo', 'Correctivo', 'Inspección', 'Cambio de aceite / filtros',
  'Cubiertas', 'Auxilio en campo', 'Otro'];

// ══════════════════════════════════════════════════════════════════
// ARRANQUE
// ══════════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', iniciar);
window.addEventListener('online',  () => $('offline-banner').classList.remove('show'));
window.addEventListener('offline', () => $('offline-banner').classList.add('show'));

async function iniciar() {
  if (!navigator.onLine) $('offline-banner').classList.add('show');
  if (!sb) return;
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) {
    // El login vive en la app de partes: se entra por ahí.
    location.href = APP_PARTES;
    return;
  }
  mostrarCarga('Cargando flota…');
  // v20261014b: los datos de la flota se piden YA, en paralelo con el perfil
  // (antes: perfil → reportes → recién ahí la flota, todo en fila). Si la persona
  // no puede ver la flota, la base no le devuelve nada y se la manda a partes igual.
  const pre = navigator.onLine ? {
    cat: pedirCatalogos(),
    flota: sb.from('v_flota').select('*').order('id').then(r => r, e => ({ error: e })),
    alertas: sb.from('v_alertas_flota').select('*').order('dias', { nullsFirst: false }).then(r => r, e => ({ error: e })),
  } : {};
  try {
    const { data: perfil, error } = await sb.from('perfiles').select('*')
      .eq('id', data.session.user.id).maybeSingle();
    if (error) throw error;
    sesion = perfil;
    if (!perfil) { ocultarCarga(); location.href = APP_PARTES; return; }
  } catch (e) {
    // Sin señal: el último perfil conocido, solo si es de esta misma persona
    const guardado = leerLocal('perfil');
    if (!guardado || guardado.id !== data.session.user.id) { ocultarCarga(); location.href = APP_PARTES; return; }
    sesion = guardado;
  }
  if (!['taller', 'admin_central', 'admin_obra', 'gerente'].includes(sesion.rol)) {
    location.href = APP_PARTES;
    return;
  }
  $('hdr-usuario').textContent = `${sesion.nombre} · ${etiquetaRol(sesion.rol)}`;
  Menu.pintar('flota', sesion.rol);
  Menu.reportes(sb);   // si cambia algo, repinta el menú solo; no hace falta esperarlo
  sb.rpc('mis_formularios').then(({ data }) => {
    if (Array.isArray(data) && data.length) {
      guardarLocal('fx_formularios', data);
      Menu.pintar('flota', sesion.rol, data);
      if (pantallaActual) Menu.activar(pantallaActual);
      pintarContadorAlertas();
    }
  });
  document.querySelectorAll('.solo-taller').forEach(el => el.style.display = esTaller() ? '' : 'none');

  vista = leerLocal('flota_vista') || (window.innerWidth >= 900 ? 'tabla' : 'tarjetas');
  // Los filtros guardados se leen ANTES de cargar: cargarFlota() filtra y guarda
  // (antes pisaba lo guardado y al volver a entrar los filtros quedaban en blanco).
  const filtrosGuardados = leerLocal('flota_filtros');
  await Promise.all([cargarCatalogos(pre.cat), cargarFlota(pre.flota), cargarAlertas(pre.alertas)]);
  restaurarFiltros(filtrosGuardados);
  mostrarPantalla(Menu.inicial() || 'flota');
  ocultarCarga();

  // Abrir un equipo directo: flota.html#CV-05
  const desdeUrl = decodeURIComponent(location.hash.replace('#', ''));
  if (desdeUrl && flota.some(f => f.id === desdeUrl)) abrirFicha(desdeUrl);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
}

function etiquetaRol(r) {
  return { operador: 'Operador', admin_obra: 'Admin de obra', taller: 'Taller', gerente: 'Gerente',
           admin_central: 'Administrador' }[r] || r;
}

async function cerrarSesion() {
  await sb.auth.signOut();
  try { localStorage.removeItem('perfil'); localStorage.removeItem('ia_chat'); localStorage.removeItem('tecsul_acceso_obras'); } catch (e) {}
  location.href = APP_PARTES;
}

function leerLocal(k) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}
function guardarLocal(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

// ══════════════════════════════════════════════════════════════════
// DATOS
// ══════════════════════════════════════════════════════════════════
function pedirCatalogos() {
  const q = (t, cols, ord) => sb.from(t).select(cols).order(ord || 'nombre');
  return Promise.all([
    q('cat_tipos_equipo', 'nombre,activo'),
    q('cat_marcas', 'nombre,activo'),
    q('cat_ubicaciones', 'nombre,activo'),
    q('cat_disponibilidad', 'nombre,activo,orden', 'orden'),
    q('asignaciones', 'nombre,obra_clave,activo'),
    sb.from('operadores').select('cedula,nombre,especialidad,activo').order('nombre'),
    sb.rpc('lista_responsables'),
  ]);
}
// `pre`: la misma consulta ya lanzada antes (arranque); si no, se pide ahora
async function cargarCatalogos(pre) {
  const r = await (pre || pedirCatalogos());
  const [tipos, marcas, ubic, disp, asig, ops, resp] = r.map(x => x.data || []);
  cat = { tipos, marcas, ubic, disp, asig, ops, resp };
  guardarLocal('flota_catalogos', cat);

  llenarFiltro('f-estado', ESTADOS);
  llenarFiltro('f-disp', disp.map(d => d.nombre));
  llenarFiltro('f-asig', asig.map(a => a.nombre));
  llenarFiltro('f-grupo', GRUPOS);
}

// v20261027a: los filtros son de selección múltiple (multisel.js): al
// rearmar la lista se conservan todos los valores elegidos.
function llenarFiltro(id, valores) {
  const sel = $(id), actual = sel._pend || MS.valores(sel);
  sel.innerHTML = '<option value="">Todos</option>' +
    valores.map(v => `<option>${esc(v)}</option>`).join('');
  MS.poner(sel, actual);
  if (sel._pend && actual.every(v => valores.includes(v))) delete sel._pend;
}

async function cargarFlota(pre) {
  const { data, error } = await (pre || sb.from('v_flota').select('*').order('id'));
  if (error) {
    flota = leerLocal('flota_cache') || [];
    toast('No se pudo actualizar: ' + error.message, 'error');
  } else {
    flota = data;
    await Promise.all([sumarObsAuto(flota), sumarEnganches(flota)]);
    guardarLocal('flota_cache', flota);
  }
  recalcularOperadores();
  pintarAvisosOp();
  // Los tipos que realmente existen, para el filtro
  llenarFiltro('f-tipo', [...new Set(flota.map(f => f.tipo).filter(Boolean))].sort());
  filtrar();
  if (fichaId) pintarCabeceraFicha();
}

// v20261026d (SQL 57): la observación es solo manual; lo que escriben el parte y
// las OT va a observacion_auto. Se lee directo de equipo_estado (v_flota no
// cambia). Sin el SQL 57 corrido, la consulta falla y todo sigue como antes.
// v20261026e (SQL 58): también las observaciones generales del último parte.
async function sumarObsAuto(filas) {
  const CAMPOS = ['observacion_auto', 'observacion_auto_en', 'observacion_parte', 'observacion_parte_en'];
  try {
    let r = await sb.from('equipo_estado').select('equipo_id,' + CAMPOS.join(','));
    if (r.error) r = await sb.from('equipo_estado').select('equipo_id,observacion_auto,observacion_auto_en');   // sin el SQL 58
    if (r.error) return;
    const m = new Map((r.data || []).map(x => [x.equipo_id, x]));
    filas.forEach(f => { const x = m.get(f.id) || {}; CAMPOS.forEach(k => { f[k] = x[k] ?? null; }); });
  } catch (e) { /* sin señal: quedan sin los avisos automáticos */ }
}

async function cargarAlertas(pre) {
  const [r, op] = await Promise.all([
    pre || sb.from('v_alertas_flota').select('*').order('dias', { nullsFirst: false }),
    // v20261027a (SQL 61): cambios de operador sin ver. Sin el SQL, viene vacío.
    sb.from('v_avisos_operador').select('*').eq('tipo', 'Cambio de operador').order('momento', { ascending: false })
      .then(x => x, e => ({ error: e })),
  ]);
  alertas = r.error ? [] : (r.data || []);
  avisosOp = op.error ? [] : (op.data || []);
  pintarContadorAlertas();
  pintarAlertas();
  pintarAvisosOp();
  if (pantallaActual === 'flota') pintarLista();
}

// ══════════════════════════════════════════════════════════════════
// LISTA
// ══════════════════════════════════════════════════════════════════
const FILTROS = ['f-buscar', 'f-categoria', 'f-estado', 'f-disp', 'f-asig', 'f-tipo', 'f-grupo', 'f-eng'];
let filtroTarjeta = null;

function restaurarFiltros(guardados) {
  const f = guardados || leerLocal('flota_filtros') || {};
  FILTROS.forEach(id => {
    if (f[id] === undefined) return;
    if (id === 'f-buscar') { $(id).value = f[id]; return; }
    const vals = Array.isArray(f[id]) ? f[id] : (f[id] ? [f[id]] : []);   // antes se guardaba un solo valor
    MS.poner(id, vals);
    // Si la lista todavía no tiene esas opciones (se cargan después), quedan pendientes
    if (MS.valores(id).length < vals.length) $(id)._pend = vals;
  });
  $('f-bajas').checked = !!f['f-bajas'];
  $('f-terceros').checked = !!f['f-terceros'];
  filtrar();
}

function limpiarFiltros() {
  FILTROS.forEach(id => $(id).value = '');
  $('f-categoria').value = 'maquinas';
  $('f-bajas').checked = false;
  $('f-terceros').checked = false;
  filtroTarjeta = null;
  filtrar();
}

function enTaller(f) {
  return f.estado !== 'Operativo' && (f.disponibilidad === 'En Reparación' || f.fecha_inoperativo);
}

// Categoría (varias a la vez): "maquinas" = equipos + vehículos livianos;
// "terceros" = los alquilados, de cualquier categoría. Los de terceros solo
// se ven con esa opción o con la casilla "De terceros" (como los dados de baja).
function pasaCategoria(f) {
  const cats = MS.valores('f-categoria');
  const terceros = cats.includes('terceros');
  const lista = cats.filter(c => c !== 'terceros').flatMap(c => c === 'maquinas' ? ['equipo', 'vehiculo_liviano'] : [c]);
  if (f.propiedad === 'Tercero') {
    if (terceros) return true;
    if (!$('f-terceros').checked) return false;
  } else if (terceros && !lista.length) return false;
  return !lista.length || lista.includes(f.categoria);
}

function filtradas() {
  const texto = $('f-buscar').value.toLowerCase().trim();
  return flota.filter(f => {
    if (!$('f-bajas').checked && !f.activo) return false;
    if (!pasaCategoria(f)) return false;
    if (!MS.ok('f-estado', f.estado)) return false;
    if (!MS.ok('f-disp', f.disponibilidad)) return false;
    if (!MS.ok('f-asig', f.asignacion)) return false;
    if (!MS.ok('f-tipo', f.tipo)) return false;
    if (!MS.ok('f-grupo', f.grupo)) return false;
    if (!MS.ok('f-eng', tipoEnganche(f))) return false;
    if (filtroTarjeta && !filtroTarjeta.fn(f)) return false;
    if (texto) {
      const pajar = [f.id, f.descripcion, f.tipo, f.marca, f.modelo, f.chapa, f.nro_serie,
        f.operador_habitual_nombre, f.responsable, f.observacion, f.observacion_auto, f.observacion_parte, f.asignacion, f.ubicacion,
        f.enganchado_a, (f.accesorios || []).join(' ')]
        .join(' ').toLowerCase();
      if (!texto.split(/\s+/).every(p => pajar.includes(p))) return false;
    }
    return true;
  });
}

function filtrar() {
  const f = {};
  FILTROS.forEach(id => f[id] = id === 'f-buscar' ? $(id).value : ($(id)._pend || MS.valores(id)));
  f['f-bajas'] = $('f-bajas').checked;
  f['f-terceros'] = $('f-terceros').checked;
  guardarLocal('flota_filtros', f);
  const activos = ['f-categoria', 'f-estado', 'f-disp', 'f-asig', 'f-tipo', 'f-grupo', 'f-eng']
    .filter(id => { const l = MS.valores(id); return l.length && !(id === 'f-categoria' && l.join() === 'maquinas'); }).length + (f['f-bajas'] ? 1 : 0) + (f['f-terceros'] ? 1 : 0);

// Disponibilidad: color según lo que significa
function colorDisp(v) {
  const t = String(v || '').toLowerCase();
  if (!t) return '';
  if (t.includes('repar') || t.includes('taller')) return 'rojo';
  if (t.includes('trabaj')) return 'verde';
  if (t.includes('dispos')) return 'amarillo';
  if (t.includes('traslado') || t.includes('liberad')) return 'celeste';
  if (t.includes('alquil')) return 'violeta';
  if (t.includes('baja') || t.includes('venta') || t.includes('parad')) return 'gris';
  return 'azul';
}
function chipDisp(v) {
  return v ? `<span class="chip ${colorDisp(v)}">${esc(v)}</span>` : '';
}
// Asignación / ubicación: color fijo por nombre (hash), así cada obra o lugar se reconoce a simple vista
function colorNombre(v) {
  const t = String(v || '').trim().toLowerCase();
  let h = 0;
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return 'p' + (h % 10);
}
function chipNombre(v) {
  return v ? `<span class="chip ${colorNombre(v)}">${esc(v)}</span>` : '';
}

function chipDinatran(d) {
  if (d === null || d === undefined) return '';
  if (d < 0) return `<span class="chip rojo">Dinatran vencido ${-d} d</span>`;
  if (d <= 30) return `<span class="chip amarillo">Dinatran ${d} d</span>`;
  return '';
}

// ══════════════════════════════════════════════════════════════════
// TABLA EDITABLE (v20261022c)
//
// Estado, disponibilidad, asignación, ubicación, responsable y operador
// se cambian desde la tabla: tocar la celda abre la lista y al elegir se
// guarda. Con las casillas de la izquierda se marcan varios equipos (o
// todos los que están a la vista) y se cambian de una vez.
//
// Permisos (los mismos que la ficha): taller y administración central
// cambian todo; el administrador de obra solo la disponibilidad; el
// gerente solo mira.
// ══════════════════════════════════════════════════════════════════
const EDITABLES = {
  estado:                   { t: 'Estado' },
  disponibilidad:           { t: 'Disponibilidad' },
  asignacion:               { t: 'Asignación' },
  ubicacion:                { t: 'Ubicación' },
  responsable:              { t: 'Responsable' },
  operador_habitual_nombre: { t: 'Operador' }
};
let seleccion = new Set();      // ids de equipos marcados
let filasTabla = [];            // las filas que se ven ahora en la tabla

const puedeEditarCampo = (k) => !!sesion && (esTaller() || (k === 'disponibilidad' && sesion.rol === 'admin_obra'));
const puedeEditarAlgo = () => Object.keys(EDITABLES).some(puedeEditarCampo);

// Opciones de cada campo: [valor, texto]
function opcionesCampo(k, f) {
  const lista = (l) => l.map(x => [x, x]);
  const conActual = (ops, v) => v && !ops.some(o => o[0] === v) ? [[v, v], ...ops] : ops;
  switch (k) {
    case 'estado':         return lista(ESTADOS);
    case 'disponibilidad': return conActual(lista(activos(cat.disp || [])), f && f.disponibilidad);
    case 'asignacion':     return conActual(lista(activos(cat.asig || [])), f && f.asignacion);
    case 'ubicacion':      return conActual(lista(activos(cat.ubic || [])), f && f.ubicacion);
    case 'responsable':    return (cat.resp || []).map(r => [r.id ? r.id : 'n:' + r.nombre, r.nombre]);
    case 'operador_habitual_nombre':
      return (cat.ops || []).filter(o => o.activo || (f && o.cedula === f.operador_habitual))
        .map(o => [o.cedula, o.nombre + (o.especialidad ? ' · ' + o.especialidad.toLowerCase() : '')]);
  }
  return [];
}
// El valor que tiene hoy el equipo, en el formato de las opciones
function valorCampo(k, f) {
  if (k === 'responsable') {
    const r = (cat.resp || []).find(r => r.id ? r.id === f.responsable_id : (!f.responsable_id && r.nombre === f.responsable));
    return r ? (r.id || 'n:' + r.nombre) : '';
  }
  if (k === 'operador_habitual_nombre') return f.operador_habitual || '';
  return f[k] || '';
}

function celdaVista(k, f) {
  const v = f[k];
  if (k === 'estado') return chipEstado(v);
  if (k === 'disponibilidad') return chipDisp(v);
  if (k === 'asignacion' || k === 'ubicacion') return chipNombre(v);
  return esc(v ?? '');
}

function pintarTabla(filas) {
  // Se conserva el scroll de la tabla al redibujar (después de guardar)
  const antes = document.querySelector('#lista .tabla-wrap');
  const scroll = antes ? [antes.scrollTop, antes.scrollLeft] : null;
  filasTabla = filas;
  const editar = puedeEditarAlgo();
  // La selección vale solo para lo que está a la vista
  const visibles = new Set(filas.map(f => f.id));
  seleccion.forEach(id => { if (!visibles.has(id)) seleccion.delete(id); });
  const todos = editar && filas.length && filas.every(f => seleccion.has(f.id));

  $('lista').innerHTML = (editar ? barraSeleccion() : '') + `<div class="tabla-wrap"><table class="tabla"><thead><tr>${
    editar ? `<th class="chk" onclick="event.stopPropagation()"><input type="checkbox" title="Seleccionar todos los que se ven"
      ${todos ? 'checked' : ''} onchange="marcarTodos(this.checked)"></th>` : ''}${
    colsVisibles().map(([k, t]) => `<th class="${orden.col === k ? 'activo' : ''}" onclick="ordenarPor('${k}')">${t}${orden.col === k ? (orden.asc ? ' ▲' : ' ▼') : ''}</th>`).join('')
  }</tr></thead><tbody>${filas.map(f => `<tr class="${f.activo ? '' : 'baja'}${seleccion.has(f.id) ? ' marcada' : ''}" data-id="${esc(f.id)}" onclick="abrirFicha(this.dataset.id)">${
    editar ? `<td class="chk" onclick="event.stopPropagation()"><input type="checkbox" ${seleccion.has(f.id) ? 'checked' : ''}
      onchange="marcar(this.closest('tr').dataset.id, this.checked)"></td>` : ''}${
    colsVisibles().map(([k]) => {
      if (EDITABLES[k] && puedeEditarCampo(k)) {
        return `<td class="ed" data-k="${k}" title="Cambiar ${EDITABLES[k].t.toLowerCase()}"
          onclick="editarCelda(event, this)">${celdaVista(k, f)}${k === 'operador_habitual_nombre' ? chipsOperador(f, true) : ''}<span class="lapiz">▾</span></td>`;
      }
      if (k === 'operador_habitual_nombre') return `<td>${esc(f[k] ?? '')}${chipsOperador(f, true)}</td>`;
      if (k === 'enganche') return `<td>${chipEnganche(f, true)}</td>`;
      let v = f[k];
      if (k === 'estado' || k === 'disponibilidad' || k === 'asignacion' || k === 'ubicacion') return `<td>${celdaVista(k, f)}</td>`;
      if (k.startsWith('venc_') || k.startsWith('fecha_') || k.endsWith('_fecha')) v = fmtFecha(v);
      if (k === 'venc_dinatran' && f.dias_dinatran !== null && f.dias_dinatran <= 30)
        return `<td>${chipDinatran(f.dias_dinatran)} ${esc(v)}</td>`;
      return `<td class="${k === 'observacion' || k === 'observacion_auto' || k === 'observacion_parte' ? 'larga' : ''}">${esc(v ?? '')}</td>`;
    }).join('')
  }</tr>`).join('')}</tbody></table></div>`;

  if (scroll) { const w = document.querySelector('#lista .tabla-wrap'); if (w) [w.scrollTop, w.scrollLeft] = scroll; }
}

// ── Una celda ─────────────────────────────────────────────────────
function editarCelda(ev, td) {
  ev.stopPropagation();
  if (td.querySelector('select')) return;
  const id = td.closest('tr').dataset.id, k = td.dataset.k;
  const f = flota.find(x => x.id === id);
  if (!f) return;
  const actual = valorCampo(k, f);
  const vacio = k === 'estado' ? '' : `<option value="" ${actual ? '' : 'selected'}>— (vacío)</option>`;
  td.innerHTML = `<select class="sel-celda">${vacio}${opcionesCampo(k, f).map(([v, t]) =>
    `<option value="${esc(v)}" ${v === actual ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  const s = td.querySelector('select');
  s.onclick = (e) => e.stopPropagation();
  let guardando = false;
  s.onchange = async () => {
    guardando = true;
    if (s.value === actual) return pintarLista();
    await guardarEdicion([id], { [k]: s.value });
  };
  s.onblur = () => { if (!guardando) setTimeout(() => { if (!guardando) pintarLista(); }, 150); };
  s.onkeydown = (e) => { if (e.key === 'Escape') { guardando = true; pintarLista(); } };
  s.focus();
  try { s.showPicker(); } catch (e) { /* navegadores sin showPicker: queda enfocada */ }
}

// ── Varios a la vez ───────────────────────────────────────────────
function marcar(id, on) {
  on ? seleccion.add(id) : seleccion.delete(id);
  pintarLista();
}
function marcarTodos(on) {
  filasTabla.forEach(f => on ? seleccion.add(f.id) : seleccion.delete(f.id));
  pintarLista();
}
function limpiarSeleccion() { seleccion.clear(); pintarLista(); }

function barraSeleccion() {
  if (!seleccion.size) {
    return `<div class="barra-sel vacia">Tocá una celda con ▾ para cambiarla, o marcá varios equipos
      (la casilla del título marca todos los que se ven) para cambiarlos de una vez.</div>`;
  }
  const campos = Object.keys(EDITABLES).filter(puedeEditarCampo);
  return `<div class="barra-sel">
    <b>${seleccion.size} equipo(s) seleccionado(s)</b>
    ${campos.map(k => `<label>${EDITABLES[k].t}
      <select id="lote-${k}"><option value="__igual__">— sin cambiar —</option>${k === 'estado' ? '' : '<option value="">— (vaciar)</option>'}${
        opcionesCampo(k, null).map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`).join('')}
    <button class="btn btn-verde" onclick="aplicarLote()">Aplicar</button>
    <button class="btn btn-gris" onclick="limpiarSeleccion()">Quitar selección</button>
  </div>`;
}

async function aplicarLote() {
  const cambios = {};
  Object.keys(EDITABLES).filter(puedeEditarCampo).forEach(k => {
    const el = $('lote-' + k);
    if (el && el.value !== '__igual__') cambios[k] = el.value;
  });
  if (!Object.keys(cambios).length) return toast('Elegí al menos un valor para cambiar', 'warning');
  const ids = [...seleccion];
  const txt = Object.entries(cambios).map(([k, v]) => {
    const op = opcionesCampo(k, null).find(o => o[0] === v);
    return `• ${EDITABLES[k].t}: ${v === '' ? '(vacío)' : (op ? op[1] : v)}`;
  }).join('\n');
  if (!confirm(`¿Cambiar ${ids.length} equipo(s)?\n\n${txt}`)) return;
  const ok = await guardarEdicion(ids, cambios);
  if (ok) { seleccion.clear(); pintarLista(); }
}

// ── Guardar (una celda o varios equipos) ──────────────────────────
// `cambios` viene con las claves de la tabla y los valores de las listas.
async function guardarEdicion(ids, cambios) {
  const estado = {};
  let operador;
  for (const [k, v] of Object.entries(cambios)) {
    if (k === 'responsable') {
      if (v.startsWith('n:')) { estado.responsable_id = null; estado.responsable_nombre = v.slice(2); }
      else { estado.responsable_id = v || null; estado.responsable_nombre = null; }
    } else if (k === 'operador_habitual_nombre') operador = v || null;
    else estado[k] = v || (k === 'estado' ? 'Operativo' : null);
  }
  // v20261027a: avisar si el operador queda en más de una máquina
  if (operador && !confirmarOperador(ids, operador)) { pintarLista(); return false; }
  mostrarCarga(ids.length > 1 ? `Guardando ${ids.length} equipos…` : 'Guardando…');
  try {
    if (esTaller()) {
      // De a 100 para no armar una URL gigante
      for (let i = 0; i < ids.length; i += 100) {
        const parte = ids.slice(i, i + 100);
        if (Object.keys(estado).length) {
          const r = await sb.from('equipo_estado').update(estado).in('equipo_id', parte);
          if (r.error) throw r.error;
        }
        if (operador !== undefined) {
          const r = await sb.from('equipos').update({ operador_habitual: operador }).in('id', parte);
          if (r.error) throw r.error;
        }
      }
    } else if ('disponibilidad' in estado) {
      // Administrador de obra: solo disponibilidad, por la función de siempre
      for (const id of ids) {
        const r = await sb.rpc('cambiar_disponibilidad', { p_equipo: id, p_disponibilidad: estado.disponibilidad, p_nota: null });
        if (r.error) throw r.error;
      }
    }
  } catch (e) {
    ocultarCarga();
    toast('No se pudo guardar: ' + (e.message || e), 'error');
    await cargarFlota();
    return false;
  }
  // Se actualiza la tabla al instante y después se relee de la base
  const nombreResp = estado.responsable_nombre ?? ((cat.resp || []).find(r => r.id && r.id === estado.responsable_id) || {}).nombre ?? null;
  ids.forEach(id => {
    const f = flota.find(x => x.id === id);
    if (!f) return;
    ['estado', 'disponibilidad', 'asignacion', 'ubicacion'].forEach(k => { if (k in estado) f[k] = estado[k]; });
    if ('responsable_id' in estado) { f.responsable_id = estado.responsable_id; f.responsable = nombreResp; }
    if (operador !== undefined) {
      f.operador_habitual = operador;
      f.operador_habitual_nombre = ((cat.ops || []).find(o => o.cedula === operador) || {}).nombre || null;
    }
  });
  recalcularOperadores();
  pintarAvisosOp();
  ocultarCarga();
  toast(ids.length > 1 ? `${ids.length} equipos actualizados` : 'Guardado', 'success');
  pintarTarjetas();
  pintarLista();
  cargarFlota();
  cargarAlertas();
  return true;
}

function ordenarPor(col) {
  orden = { col, asc: orden.col === col ? !orden.asc : true };
  pintarLista();
}

function ordenar(filas) {
  const { col, asc } = orden;
  return [...filas].sort((a, b) => {
    const x = a[col], y = b[col];
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    const r = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'es', { numeric: true });
    return asc ? r : -r;
  });
}

function fmtFecha(v) {
  if (!v) return '';
  const [a, m, d] = String(v).slice(0, 10).split('-');
  return d ? `${d}/${m}/${a}` : v;
}
function fmtMomento(v) {
  if (!v) return '';
  return new Date(v).toLocaleString('es-PY', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function fmtNum(v, dec = 0) {
  if (v === null || v === undefined || v === '') return '';
  return Number(v).toLocaleString('es-PY', { maximumFractionDigits: dec });
}

function equipo() { return flota.find(f => f.id === fichaId); }

  fichaId = id;

function tabFicha(t) {

  document.querySelectorAll('#ficha-tabs button').forEach(b =>
    b.style.display = obraSola && FICHA_SIN_OBRA.includes(b.dataset.t) ? 'none' : '');

// ── Helpers de formularios ────────────────────────────────────────
function opciones(lista, actual, vacio = '—') {
  const vals = [...lista];
  if (actual && !vals.includes(actual)) vals.unshift(actual);
  return `<option value="">${vacio}</option>` +
    vals.map(v => `<option ${v === actual ? 'selected' : ''}>${esc(v)}</option>`).join('');
}
function campo(id, etiqueta, html, clase = '') {
  return `<div class="field ${clase}"><label for="${id}">${etiqueta}</label>${html}</div>`;
}
function inp(id, valor, tipo = 'text', extra = '') {
  return `<input type="${tipo}" id="${id}" value="${esc(valor ?? '')}" ${extra}>`;
}
function sel(id, lista, actual, extra = '', vacio) {
  return `<select id="${id}" ${extra}>${opciones(lista, actual, vacio)}</select>`;
}
// Lista de un catálogo de flota con la opción "Agregar nuevo…" al
// final (solo para quien puede editar catálogos: taller y admin).
const CAT_TABLA = { asig: 'asignaciones', ubic: 'cat_ubicaciones', tipos: 'cat_tipos_equipo', marcas: 'cat_marcas' };
function selCat(id, clave, actual, extra = '') {
  const nuevo = esTaller() && !/disabled/.test(extra) ? '<option value="__nuevo__">＋ Agregar nuevo…</option>' : '';
  return `<select id="${id}" ${extra} onchange="if(this.value==='__nuevo__')agregarValorCatalogo(this,'${clave}')">${
    opciones(activos(cat[clave] || []), actual)}${nuevo}</select>`;
}
function agregarValorCatalogo(selEl, clave) {
  selEl.value = '';
  selEl.style.display = 'none';
  const caja = document.createElement('div');
  caja.style.cssText = 'display:flex;gap:6px';
  caja.innerHTML = `<input type="text" placeholder="Nombre nuevo" style="flex:1">
    <button type="button" class="btn-mini btn-verde">Agregar</button>
    <button type="button" class="btn-mini btn-gris">✕</button>`;
  selEl.after(caja);
  const [entrada, ok, cancelar] = caja.children;
  entrada.focus();
  const cerrar = () => { caja.remove(); selEl.style.display = ''; };
  cancelar.onclick = cerrar;
  const guardar = async () => {
    const nombre = entrada.value.trim();
    if (!nombre) return entrada.focus();
    const lista = cat[clave] || (cat[clave] = []);
    const existente = lista.find(x => x.nombre.toLowerCase() === nombre.toLowerCase());
    let valor = existente ? existente.nombre : nombre;
    if (!existente || existente.activo === false) {
      ok.disabled = true;
      const { error } = existente
        ? await sb.from(CAT_TABLA[clave]).update({ activo: true }).eq('nombre', valor)
        : await sb.from(CAT_TABLA[clave]).insert({ nombre: valor });
      ok.disabled = false;
      if (error) return toast('No se pudo agregar: ' + error.message, 'error');
      if (existente) existente.activo = true; else lista.push({ nombre: valor, activo: true });
      lista.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
      guardarLocal('flota_catalogos', cat);
      if (clave === 'asig') llenarFiltro('f-asig', lista.map(a => a.nombre));
      toast(`"${valor}" agregado`, 'success');
    }
    const opt = [...selEl.options].find(o => o.value === valor);
    if (!opt) selEl.add(new Option(valor, valor), selEl.options[selEl.options.length - 1]);
    selEl.value = valor;
    cerrar();
  };
  ok.onclick = guardar;
  entrada.onkeydown = (e) => { if (e.key === 'Enter') guardar(); if (e.key === 'Escape') cerrar(); };
}
function txt(id, valor, extra = '') {
  return `<textarea id="${id}" ${extra}>${esc(valor ?? '')}</textarea>`;
}
const val = (id) => {
  const el = $(id);
  if (!el) return undefined;
  if (el.type === 'checkbox') return el.checked;
  const v = el.value.trim();
  if (v === '') return null;
  if (el.type === 'number') return Number(v);
  return v;
};
const activos = (lista) => lista.filter(x => x.activo !== false).map(x => x.nombre);

// v20261022b: los responsables salen de Administración › Responsables. Pueden
// tener usuario de la app (se guarda responsable_id) o ser solo un nombre
// (se guarda responsable_nombre, con responsable_id vacío).
function selResponsable(f, resp, dis) {
  const esEste = r => r.id ? r.id === f.responsable_id : (!f.responsable_id && r.nombre === f.responsable);
  const hay = resp.some(esEste);
  const vacio = f.responsable && !hay ? f.responsable + (f.responsable_id ? '' : ' (sin usuario)') : '—';
  return `<select id="e-resp" ${dis}><option value="">${esc(vacio)}</option>${
    resp.map(r => `<option value="${r.id ? r.id : 'n:' + esc(r.nombre)}" ${esEste(r) ? 'selected' : ''}>${esc(r.nombre)}</option>`).join('')}</select>`;
}

async function guardarEstado() {
  const f = equipo();
  let error;
  mostrarCarga('Guardando…');
  if (esTaller()) {
    const form = {
      estado: val('e-estado') || 'Operativo',
      disponibilidad: val('e-disp'),
      asignacion: val('e-asig'),
      ubicacion: val('e-ubic'),
      responsable_id: val('e-resp'),
      fecha_inoperativo: val('e-fin'),
      fecha_estimada_operacion: val('e-fest'),
      estado_en_obra: val('e-eobra'),
      fecha_desafectacion: val('e-fdes'),
      pago: val('e-pago'),
      observacion: val('e-obs'),
    };
    // v20261014d: solo lo que cambió respecto de lo que se abrió. Antes se mandaba
    // el formulario entero y, si mientras tanto otra persona (o un parte con falla)
    // había cambiado otro campo, se volvía en silencio al valor viejo.
    const rv = String(val('e-resp') || '');
    const rNombre = rv.startsWith('n:') ? rv.slice(2) : null;
    if (rNombre) form.responsable_id = null;
    const cambios = {};
    Object.keys(form).forEach(k => { if (String(form[k] ?? '') !== String(f[k] ?? '')) cambios[k] = form[k]; });
    // Responsable sin usuario: va por nombre
    if (rNombre && (rNombre !== f.responsable || f.responsable_id)) {
      cambios.responsable_id = null; cambios.responsable_nombre = rNombre;
    }
    // Se eligió un responsable con usuario (o ninguno): el nombre viejo se
    // limpia (con usuario, la base lo vuelve a completar con su nombre)
    if (!rNombre && 'responsable_id' in cambios) cambios.responsable_nombre = null;
    if (!Object.keys(cambios).length) { ocultarCarga(); return toast('No hay cambios para guardar'); }
    const r = await sb.from('equipo_estado').update(cambios).eq('equipo_id', f.id);
    error = r.error;
  } else {
    // Admin de obra: solo la disponibilidad (la observación la carga taller)
    const r = await sb.rpc('cambiar_disponibilidad', {
      p_equipo: f.id, p_disponibilidad: val('e-disp'), p_nota: null });
    error = r.error;
  }
  ocultarCarga();
  if (error) return toast('No se pudo guardar: ' + error.message, 'error');
  toast('Guardado', 'success');
  await cargarFlota();
  cargarAlertas();
  tabFicha('estado');
}

  if (val('t-op') && val('t-op') !== (equipo() || {}).operador_habitual && !confirmarOperador([fichaId], val('t-op'))) return;
  const datos = {
    id: nuevoId, descripcion: val('t-desc') || '', categoria: val('t-cat'), tipo: val('t-tipo'),
    marca: val('t-marca'), modelo: val('t-modelo'), grupo: val('t-grupo'),

    cedula_verde: val('t-cverde'), doc_dinatran: val('t-ddin'), venc_dinatran: val('t-vdin'),

async function abrirDocumento(id) {
  const d = (window._docs || []).find(x => x.id === id);
  if (!d) return;
  if (d.drive_url) return window.open(d.drive_url, '_blank');
  if (!d.storage_path) return toast('El documento no tiene archivo', 'warning');
  const { data, error } = await sb.storage.from(BUCKET_DOCS).createSignedUrl(d.storage_path, 600);
  if (error) return toast('No se pudo abrir: ' + error.message, 'error');
  window.open(data.signedUrl, '_blank');
}

async function subirDocumento() {
  const archivo = $('d-arch').files[0];
  const categoria = val('d-cat');
  const nombre = val('d-nombre') || (archivo && archivo.name);
  const venc = val('d-venc');
  if (!archivo) return toast('Elegí un archivo', 'warning');
  if (archivo.size > 20 * 1024 * 1024) return toast('El archivo pasa de 20 MB', 'warning');
  const limpio = archivo.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_');
  const ruta = `equipos/${fichaId}/${Date.now()}_${limpio}`;
  mostrarCarga('Subiendo…');
  const up = await sb.storage.from(BUCKET_DOCS).upload(ruta, archivo, { contentType: archivo.type });
  if (up.error) { ocultarCarga(); return toast('No se pudo subir: ' + up.error.message, 'error'); }
  const { error } = await sb.from('documentos').insert({
    equipo_id: fichaId, categoria, nombre, vencimiento: venc, storage_path: ruta,
    mime: archivo.type, tamano_bytes: archivo.size });
  if (!error && venc && ['Habilitación Dinatran', 'Habilitación Municipal'].includes(categoria)) {
    const campoVenc = categoria === 'Habilitación Dinatran' ? 'venc_dinatran' : 'venc_habilitacion_municipal';
    await sb.from('equipos').update({ [campoVenc]: venc }).eq('id', fichaId);
  }
  ocultarCarga();
  if (error) return toast('No se pudo registrar: ' + error.message, 'error');
  toast('Documento subido', 'success');
  if (venc) { cargarFlota(); cargarAlertas(); }
  pintarDocumentos();
}

async function borrarDocumento(id) {
  const d = (window._docs || []).find(x => x.id === id);
  if (!d || !confirm(`¿Quitar "${d.nombre}"?`)) return;
  const { error } = await sb.from('documentos').delete().eq('id', id);
  if (error) return toast('No se pudo quitar: ' + error.message, 'error');
  if (d.storage_path && !d.drive_file_id) await sb.storage.from(BUCKET_DOCS).remove([d.storage_path]);
  pintarDocumentos();
}

async function pintarHistorial() {
  const { data, error } = await sb.from('equipo_estado_historial').select('*')
    .eq('equipo_id', fichaId).order('momento', { ascending: false }).limit(100);
  if (error) return $('ficha-cuerpo').innerHTML = `<div class="aviso-caja rojo">${esc(error.message)}</div>`;
  const ids = [...new Set(data.map(h => h.usuario_id).filter(Boolean))];
  let nombres = {};
  if (ids.length) {
    const r = await sb.rpc('nombres_usuarios', { p_ids: ids });
    (r.data || []).forEach(u => nombres[u.id] = u.nombre);
  }
  const fmtVal = (k, v) => {
    if (v === null || v === undefined || v === '') return '—';
    if (k.startsWith('fecha')) return fmtFecha(v);
    if (k === 'responsable_id') return ((cat.resp || []).find(r => r.id === v) || {}).nombre || 'usuario';
    return v;
  };
  $('ficha-cuerpo').innerHTML = `<div class="card"><div class="card-header">Cambios de estado (${data.length})</div><div class="card-body">
    ${data.length ? `<ul class="lista-simple">${data.map(h => {
      const cambios = Object.entries(h.cambios || {}).filter(([k]) => NOMBRES_CAMPO[k] !== null
        && !(k === 'responsable_nombre' && (h.cambios || {}).responsable_id));

        ${cambios.map(([k, [a, d]]) => `<div class="cambio">${esc(NOMBRES_CAMPO[k] || k)}: ${esc(fmtVal(k, a))} → <i>${esc(fmtVal(k, d))}</i></div>`).join('')}

    }).join('')}</ul>` : '<div class="empty-state">Sin cambios registrados.</div>'}

  pintarHistorialExtra();
}

    <div class="ayuda" style="font-size:12px;color:var(--gris-texto);margin-bottom:10px">Equipos y vehículos aparecen en el parte diario; tanques, contenedores y básculas no. El resto de la ficha se completa después.</div>
    <div class="acciones"><button class="btn btn-verde" onclick="crearEquipo()">Crear</button></div>`);
}

async function crearEquipo() {
  const id = normalizarCodigo(val('n-id'));
  if (!/^[A-Z]{1,5}-?\d{1,4}[A-Z]?$/.test(id) && !confirm(`El código "${id}" no tiene el formato habitual (ej: CV-21). ¿Crearlo igual?`)) return;
  if (!id) return toast('Poné el código', 'warning');
  if (flota.some(f => f.id === id)) return toast(`${id} ya existe`, 'warning');
  const categoria = val('n-cat'), tipo = val('n-tipo');
  const maquina = ['equipo', 'vehiculo_liviano'].includes(categoria);
  mostrarCarga('Creando…');
  const { error } = await sb.from('equipos').insert({
    id, categoria, tipo, marca: val('n-marca'), modelo: val('n-modelo'), chapa: val('n-chapa'),
    grupo: val('n-grupo'), descripcion: (tipo || CATEGORIAS[categoria]).toUpperCase(),
    propiedad: val('n-prop') || 'Propio', propietario_tercero: val('n-proter'),
    en_parte_diario: maquina, usa_horometro: categoria === 'equipo', usa_km: categoria === 'vehiculo_liviano' });
  if (!error && val('n-asig')) await sb.from('equipo_estado').update({ asignacion: val('n-asig') }).eq('equipo_id', id);
  ocultarCarga();
  if (error) return toast('No se pudo crear: ' + error.message, 'error');
  cerrarModal();
  toast(`${id} creado`, 'success');
  await cargarFlota();
  abrirFicha(id, 'ficha');
}

// ALERTAS
// ══════════════════════════════════════════════════════════════════
const ORDEN_ALERTAS = ['Taller demorado', 'Dinatran', 'Habilitación municipal', 'Seguro', 'Mantenimiento', 'Cambio de operador', 'Operador en varias máquinas'];

let alertaTipo = null;   // filtro de las tarjetas de alertas

// ══════════════════════════════════════════════════════════════════
// AVISOS DE OPERADOR (v20261027a, SQL 61)
//   · Operador en varias máquinas: el mismo operador habitual en 2+
//     máquinas activas. Se calcula con la flota (no necesita el SQL).
//   · Cambio de operador: cada vez que cambia (a mano o porque otro
//     operador cargó el parte) queda un aviso hasta que alguien lo marca
//     como visto. Viene de v_avisos_operador (SQL 61).
// ══════════════════════════════════════════════════════════════════
let avisosOp = [];          // cambios de operador sin ver
let opVarias = new Map();   // cédula → [equipos activos donde es operador habitual]

function recalcularOperadores() {
  opVarias = new Map();
  flota.forEach(f => {
    if (!f.activo || !f.operador_habitual) return;
    if (!opVarias.has(f.operador_habitual)) opVarias.set(f.operador_habitual, []);
    opVarias.get(f.operador_habitual).push(f.id);
  });
}
// v20261027b: un equipo con su accesorio enganchado (tractor + rastra) es UNA
// unidad: el mismo operador en los dos no cuenta como "varias máquinas".
const unidadDe = (id) => { const f = flota.find(x => x.id === id); return (f && f.enganchado_a) || id; };
function otrasMaquinasDe(f) {
  if (!f || !f.activo || !f.operador_habitual) return [];
  const u = unidadDe(f.id);
  return (opVarias.get(f.operador_habitual) || []).filter(id => id !== f.id && unidadDe(id) !== u);
}
const unidadesDe = (f) => new Set([f.id, ...otrasMaquinasDe(f)].map(unidadDe)).size;
// Lo mismo que cuentan las tarjetas (activos de la categoría elegida)
const enBaseTarjetas = (f) => f.activo && pasaCategoria(f);
function cambioOpDe(id) { return avisosOp.find(a => a.equipo_id === id); }

function chipsOperador(f, tabla) {
  const otras = otrasMaquinasDe(f), cambio = cambioOpDe(f.id);
  let h = '';
  if (otras.length) h += ` <span class="chip amarillo" title="También es operador habitual de ${esc(otras.join(', '))}">⚠️ ${tabla ? '' : esc(f.operador_habitual_nombre || 'operador') + ' · '}${unidadesDe(f)} máq.</span>`;
  if (cambio) h += ` <span class="chip azul" title="${esc(cambio.detalle)}">🔄 ${tabla ? 'cambió' : 'cambió el operador'}</span>`;
  return h;
}

// Antes de asignar: si ese operador ya es habitual de otra máquina, se pregunta
function nombreOp(ced) { return ((cat.ops || []).find(o => o.cedula === ced) || {}).nombre || ced; }
function confirmarOperador(ids, ced) {
  if (!ced) return true;
  const mias = new Set(ids.map(unidadDe));
  const otras = flota.filter(f => f.activo && f.operador_habitual === ced && !ids.includes(f.id) && !mias.has(unidadDe(f.id))).map(f => f.id);
  const total = new Set([...ids, ...otras].map(unidadDe)).size;
  if (total <= 1) return true;
  return confirm(`⚠️ ${nombreOp(ced)} ${otras.length ? 'ya es operador habitual de ' + otras.join(', ') : 'quedaría en ' + ids.length + ' máquinas'}.\n\n`
    + `Si lo asignás, va a figurar en ${total} máquinas y aparece el aviso "Operador en varias máquinas".\n\n¿Asignarlo igual?`);
}

// Franja arriba de la flota
function pintarAvisosOp() {
  const caja = $('avisos-op');
  if (!caja) return;
  // Mismo criterio que la tarjeta "Operador en 2+ máq." (los de terceros solo con su casilla)
  const conAviso = flota.filter(f => enBaseTarjetas(f) && otrasMaquinasDe(f).length);
  const varias = [...new Set(conAviso.map(f => f.operador_habitual))];
  const nMaq = conAviso.length;
  if (!avisosOp.length && !varias.length) { caja.innerHTML = ''; return; }
  const partes = [];
  if (avisosOp.length) partes.push(`<b>🔄 ${avisosOp.length} cambio${avisosOp.length === 1 ? '' : 's'} de operador sin ver</b>`);
  if (varias.length) partes.push(`<b>⚠️ ${varias.length} operador${varias.length === 1 ? '' : 'es'} en varias máquinas</b> (${nMaq} máquina${nMaq === 1 ? '' : 's'})`);
  caja.innerHTML = `<div class="avisos-op">${partes.join(' · ')}
    <button class="btn-filtro" onclick="verAvisosOp()">Ver</button></div>`;
}
function verAvisosOp() {
  if (Menu.puede('alertas')) {
    mostrarPantalla('alertas');
    filtrarAlertas(avisosOp.length ? 'Cambio de operador' : 'Operador en varias máquinas');
    return;
  }
  // Sin la solapa Alertas (taller, admin de obra): la lista en una ventana
  const varias = flota.filter(f => enBaseTarjetas(f) && otrasMaquinasDe(f).length);
  const marca = sesion.rol !== 'gerente';
  abrirModal('Avisos de operador', `
    ${avisosOp.length ? `<h4 style="margin:0 0 6px">Cambios de operador sin ver</h4><ul class="enganche-lista">${avisosOp.map(a => `
      <li><div class="pri"><b>${esc(a.equipo_id)}</b><span>${esc(a.detalle)} · ${fmtMomento(a.momento)}</span></div>
      ${marca ? `<button class="btn-mini btn-gris" onclick="marcarVistos([${a.cambio_id}])">Visto</button>` : ''}</li>`).join('')}</ul>
      ${marca ? `<div class="acciones" style="justify-content:flex-start;margin-bottom:12px"><button class="btn btn-gris" onclick="marcarVistos(null)">Marcar todos como vistos</button></div>` : ''}` : ''}
    ${varias.length ? `<h4 style="margin:0 0 6px">Operador en varias máquinas</h4><ul class="enganche-lista">${varias.map(f => `
      <li><div class="pri"><b>${esc(f.id)}</b><span>${esc(f.operador_habitual_nombre || f.operador_habitual)} también en ${esc(otrasMaquinasDe(f).join(', '))}</span></div>
      <button class="btn-mini btn-gris" onclick="cerrarModal();abrirFicha('${esc(f.id)}')">Abrir</button></li>`).join('')}</ul>` : ''}`);
}
async function marcarVistos(ids) {
  const lista = ids || avisosOp.map(a => a.cambio_id);
  if (!lista.length) return;
  const { error } = await sb.rpc('operador_cambios_marcar_vistos', { p_ids: lista });
  if (error) return toast('No se pudo marcar: ' + error.message, 'error');
  avisosOp = avisosOp.filter(a => !lista.includes(a.cambio_id));
  toast(lista.length > 1 ? `${lista.length} avisos marcados como vistos` : 'Marcado como visto', 'success');
  pintarContadorAlertas(); pintarAlertas(); pintarAvisosOp();
  if ($('modal').classList.contains('show')) { if (avisosOp.length || flota.some(f => otrasMaquinasDe(f).length)) verAvisosOp(); else cerrarModal(); }
  if (fichaId && $('hoja').classList.contains('show') && fichaTab === 'estado') pintarEstado();
  if (pantallaActual === 'flota') pintarLista();
}

// ══════════════════════════════════════════════════════════════════
// ACCESORIOS ENGANCHADOS (v20261027a, SQL 62)
// Una rastra, un semi, una plancha… se engancha a un equipo principal
// (tractor, tracto camión…). equipos.enganchado_a = código del principal.
// Sin el SQL 62 corrido, todo esto queda escondido.
// ══════════════════════════════════════════════════════════════════
let hayEnganche = false;

async function sumarEnganches(filas) {
  try {
    const r = await sb.from('equipos').select('id,enganchado_a').not('enganchado_a', 'is', null);
    if (r.error) { hayEnganche = false; return; }
    hayEnganche = true;
    const m = new Map((r.data || []).map(x => [x.id, x.enganchado_a]));
    filas.forEach(f => { f.enganchado_a = m.get(f.id) || null; f.accesorios = []; });
    const porId = new Map(filas.map(f => [f.id, f]));
    m.forEach((pr, acc) => { const p = porId.get(pr); if (p) p.accesorios.push(acc); });
    filas.forEach(f => { f.accesorios.sort(); f.enganche = f.enganchado_a ? '🔗 ' + f.enganchado_a : f.accesorios.join(', '); });
  } catch (e) { /* sin señal: quedan como estaban */ }
}
function tipoEnganche(f) { return f.enganchado_a ? 'accesorio' : (f.accesorios || []).length ? 'principal' : 'suelto'; }
function chipEnganche(f, tabla) {
  if (f.enganchado_a) return `<span class="chip enganche" title="Accesorio enganchado a ${esc(f.enganchado_a)}">🔗 ${tabla ? '' : 'enganchado a '}${esc(f.enganchado_a)}</span>`;
  if ((f.accesorios || []).length) return `<span class="chip enganche" title="Accesorios enganchados">🔗 ${esc(f.accesorios.join(', '))}</span>`;
  return '';
}

function pintarEnganche() {
  const caja = $('ficha-enganche');
  if (!caja) return;
  if (!hayEnganche) { caja.innerHTML = ''; return; }
  const f = equipo();
  if (!f) return;
  const t = esTaller();
  const fila = (id, quitar) => {
    const x = flota.find(e => e.id === id) || { id };
    return `<li><div class="pri"><b>${esc(id)}</b><span>${esc([x.tipo || x.descripcion, x.marca, x.estado].filter(Boolean).join(' · '))}</span></div>
      <button class="btn-mini btn-gris" onclick="abrirFicha('${esc(id)}')">Abrir</button>
      ${t ? `<button class="btn-mini" style="background:#fde8e8;color:#b42318" onclick="${quitar}">Soltar</button>` : ''}</li>`;
  };
  const libres = (excluir) => flota.filter(e => e.activo && e.id !== f.id && !e.enganchado_a && !excluir(e))
    .sort((a, b) => a.id.localeCompare(b.id, 'es', { numeric: true }));
  const opcion = (e) => `<option value="${esc(e.id)}">${esc(e.id)} · ${esc(e.tipo || e.descripcion || '')}</option>`;
  let h = '';
  if (f.enganchado_a) {
    h += `<p style="margin:0 0 6px;font-size:13px">Este equipo es un <b>accesorio</b> enganchado a:</p>
      <ul class="enganche-lista">${fila(f.enganchado_a, `soltarAccesorio('${esc(f.id)}')`)}</ul>`;
  } else {
    const acc = f.accesorios || [];
    h += acc.length ? `<p style="margin:0 0 6px;font-size:13px">Accesorios enganchados a <b>${esc(f.id)}</b>:</p>
      <ul class="enganche-lista">${acc.map(id => fila(id, `soltarAccesorio('${esc(id)}')`)).join('')}</ul>`
      : '<p style="margin:0 0 6px;font-size:13px;color:var(--gris-texto)">No tiene accesorios enganchados.</p>';
    if (t) {
      // Agregar un accesorio (los que no están enganchados ni tienen accesorios)
      const cand = libres(e => (e.accesorios || []).length);
      h += `<div class="enganche-form"><div class="field"><label for="eng-acc">Enganchar un accesorio a ${esc(f.id)}</label>
        <select id="eng-acc" class="ms-uno"><option value="">Elegir accesorio…</option>${cand.map(opcion).join('')}</select></div>
        <button class="btn btn-verde" onclick="engancharDesdeFicha('acc')">Enganchar</button></div>`;
      // O engancharlo a otro (solo si no tiene accesorios)
      if (!acc.length) {
        const princ = flota.filter(e => e.activo && e.id !== f.id && !e.enganchado_a)
          .sort((a, b) => a.id.localeCompare(b.id, 'es', { numeric: true }));
        h += `<div class="enganche-form"><div class="field"><label for="eng-pri">O es un accesorio: engancharlo a</label>
          <select id="eng-pri" class="ms-uno"><option value="">Elegir equipo principal…</option>${princ.map(opcion).join('')}</select></div>
          <button class="btn btn-gris" onclick="engancharDesdeFicha('pri')">Enganchar</button></div>`;
      }
    }
  }
  caja.innerHTML = `<div class="card"><div class="card-header">🔗 Accesorios / enganche</div><div class="card-body">${h}
    ${t ? '' : '<div class="aviso-caja" style="margin-top:8px">Los enganches los cambia taller.</div>'}</div></div>`;
}

async function guardarEnganche(accId, principal) {
  mostrarCarga('Guardando…');
  const { error } = await sb.from('equipos').update({ enganchado_a: principal }).eq('id', accId);
  ocultarCarga();
  if (error) {
    const m = String(error.message || '').replace(/^ENGANCHE:\s*/, '');
    toast('No se pudo guardar: ' + m, 'error');
    return false;
  }
  toast(principal ? `${accId} enganchado a ${principal}` : `${accId} quedó suelto`, 'success');
  await cargarFlota();
  if (fichaId) tabFicha(fichaTab || 'estado');
  return true;
}
function engancharDesdeFicha(modo) {
  const f = equipo();
  if (modo === 'acc') {
    const acc = $('eng-acc').value;
    if (!acc) return toast('Elegí el accesorio', 'warning');
    guardarEnganche(acc, f.id);
  } else {
    const pr = $('eng-pri').value;
    if (!pr) return toast('Elegí el equipo principal', 'warning');
    guardarEnganche(f.id, pr);
  }
}
function soltarAccesorio(accId) {
  const x = flota.find(e => e.id === accId);
  if (!confirm(`¿Soltar ${accId}${x && x.enganchado_a ? ' de ' + x.enganchado_a : ''}?`)) return;
  guardarEnganche(accId, null);
}

// Historial de la ficha: cambios de operador y de enganche (si están los SQL)

      <li><div class="pri"><b>${esc(nombreOp(c.operador_antes) || '(sin operador)')} → ${esc(nombreOp(c.operador_despues) || '(sin operador)')}</b>

      <span>${fmtMomento(c.momento)}${c.principal_antes && c.principal_despues ? ' · antes en ' + esc(c.principal_antes) : ''}</span></div></li>`).join('')}</ul>`
      : '<div class="empty-state">Sin enganches registrados.</div>'}</div></div>`;
  }
  caja.innerHTML = h;
}

// v20261027a: a las alertas de la base se suman los avisos de operador
// (cambios sin ver, de la base; operador en varias máquinas, de la flota).
function todasAlertas() {
  const varias = [];
  flota.forEach(f => {
    if (f.propiedad === 'Tercero') return;   // como en la flota: los de terceros no suman
    const otras = otrasMaquinasDe(f);
    if (otras.length) varias.push({ tipo: 'Operador en varias máquinas', equipo_id: f.id, vence: null, dias: null, nivel: 'AVISO',
      detalle: `${f.operador_habitual_nombre || f.operador_habitual} también figura como operador de ${otras.join(', ')}` });
  });
  return alertas.concat(avisosOp, varias);
}
const esAviso = (a) => a.nivel === 'AVISO';

function pintarAlertas() {
  const todas = todasAlertas();
  const tipos = ORDEN_ALERTAS.filter(t => todas.some(a => a.tipo === t));
  $('alertas-tarjetas').innerHTML = todas.length ? [
    `<button class="tarjeta ${alertaTipo ? '' : 'sel'}" onclick="filtrarAlertas(null)">
       <span class="n">${todas.length}</span><span class="t">Todas</span></button>`,
    ...tipos.map(t => {
      const del = todas.filter(a => a.tipo === t);
      const venc = del.filter(a => a.nivel === 'VENCIDO').length;
      const sub = venc ? venc + ' vencidas' : t === 'Cambio de operador' ? 'sin ver' : del.some(esAviso) ? 'avisos' : 'por vencer';
      return `<button class="tarjeta ${venc ? 'malo' : 'medio'} ${alertaTipo === t ? 'sel' : ''}" onclick="filtrarAlertas('${t}')">
        <span class="n">${del.length}</span><span class="t">${t}</span>
        <span class="t" style="text-transform:none;font-weight:600">${sub}</span></button>`;
    })].join('') : '';
  const visibles = alertaTipo ? todas.filter(a => a.tipo === alertaTipo) : todas;
  if (!visibles.length) {
    $('alertas-lista').innerHTML = '<div class="empty-state">No hay nada vencido ni por vencer. 👍</div>';
    return;
  }
  const grupos = {};
  visibles.forEach(a => (grupos[a.tipo] = grupos[a.tipo] || []).push(a));
  const claves = Object.keys(grupos).sort((a, b) => ORDEN_ALERTAS.indexOf(a) - ORDEN_ALERTAS.indexOf(b));
  const marca = sesion && sesion.rol !== 'gerente';
  $('alertas-lista').innerHTML = claves.map(k => `
    <div class="alerta-grupo"><h3>${esc(k)} <span class="chip gris">${grupos[k].length}</span>
      ${k === 'Cambio de operador' && marca ? `<button class="btn-mini btn-gris" onclick="marcarVistos(null)">Marcar todos como vistos</button>` : ''}</h3>
    ${grupos[k].map(a => `<div class="alerta" role="button" tabindex="0" onclick="desdeAlerta('${esc(a.equipo_id)}','${esc(a.tipo)}')">
      <div class="pri"><b>${esc(a.equipo_id)}</b><span>${esc(a.detalle)}${a.vence && !esAviso(a) ? ' · ' + fmtFecha(a.vence) : ''}${a.momento ? ' · ' + fmtMomento(a.momento) : ''}</span></div>
      ${a.cambio_id && marca ? `<button class="btn-mini btn-gris" onclick="event.stopPropagation();marcarVistos([${a.cambio_id}])">Visto</button>` : ''}
      <span class="chip ${a.nivel === 'VENCIDO' ? 'rojo' : 'amarillo'}">${a.dias === null ? (esAviso(a) ? 'aviso' : a.nivel) : a.dias < 0 ? 'hace ' + (-a.dias) + ' d' : a.dias === 0 ? 'hoy' : 'en ' + a.dias + ' d'}</span>
    </div>`).join('')}</div>`).join('');
}

function pintarContadorAlertas() {
  const n = $('n-alertas');
  if (!n) return;
  // vencidas + cambios de operador sin ver
  const urgentes = alertas.filter(a => a.nivel === 'VENCIDO').length + avisosOp.length;
  n.textContent = urgentes;
  n.style.display = urgentes ? '' : 'none';
}

function filtrarAlertas(t) {
  alertaTipo = t;
  pintarAlertas();
}

function desdeAlerta(id, tipo) {
  if (!flota.some(f => f.id === id)) return toast(`${id} no está en el maestro de equipos`, 'warning');
  abrirFicha(id, { Mantenimiento: 'mantenimiento', Dinatran: 'documentos',
    'Habilitación municipal': 'documentos', Seguro: 'documentos' }[tipo] || 'estado');
}

async function compartir(texto) {
  if (navigator.share) {
    try { await navigator.share({ text: texto }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
}

function compartirResumen() {
  const filas = filtradas().filter(f => f.activo);
  const hoy = new Date().toLocaleDateString('es-PY');
  const n = e => filas.filter(f => f.estado === e).length;
  const detalle = (e) => filas.filter(f => f.estado === e).map(f =>
    `• ${f.id} ${f.tipo ? '(' + f.tipo + ')' : ''}${f.asignacion ? ' – ' + f.asignacion : ''}${f.observacion || f.observacion_auto ? ': ' + (f.observacion || f.observacion_auto) : ''}${f.dias_en_taller ? ` [${f.dias_en_taller} d]` : ''}`).join('\n');
  let t = `*Estado de flota – ${hoy}*\n✅ Operativos: ${n('Operativo')}\n⚠️ Fallando: ${n('Fallando')}\n⛔ Inoperativos: ${n('Inoperativo')}`;
  if (n('Inoperativo')) t += `\n\n*Inoperativos*\n${detalle('Inoperativo')}`;
  if (n('Fallando')) t += `\n\n*Fallando*\n${detalle('Fallando')}`;
  compartir(t);
}

function compartirAlertas() {
  const todas = todasAlertas();
  const lista = alertaTipo ? todas.filter(a => a.tipo === alertaTipo) : todas;
  if (!lista.length) return toast('No hay alertas', 'warning');
  const hoy = new Date().toLocaleDateString('es-PY');
  const t = `*Alertas de flota${alertaTipo ? ' – ' + alertaTipo : ''} – ${hoy}*\n` + lista.map(a =>
    `${a.nivel === 'VENCIDO' ? '⛔' : '⚠️'} ${a.equipo_id} – ${a.tipo}: ${a.detalle}${a.vence && !esAviso(a) ? ' (' + fmtFecha(a.vence) + ')' : ''}`).join('\n');
  compartir(t);
}

function exportarCSV() {
  const filas = ordenar(filtradas());
  const cols = COLUMNAS.concat([['categoria', 'Categoría'], ['nro_serie', 'N° serie'], ['anio_fabricacion', 'Año']]);
  const csv = [cols.map(c => c[1]).join(';')].concat(filas.map(f =>
    cols.map(([k]) => `"${String(f[k] ?? '').replace(/"/g, '""')}"`).join(';'))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `flota_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}

let pantallaActual = null;
function mostrarPantalla(n) {
  if (n === 'alq' && Menu.puede('cert')) { n = 'cert'; Certificado.vista && setTimeout(() => Certificado.vista('alq'), 0); }   // Alquileres pasó a Certificado
  if (!Menu.puede(n)) n = Menu.inicial() || 'flota';   // solapa que su rol no ve
  pantallaActual = n;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + n).classList.add('active');
  Menu.activar(n);
  if (n === 'ot' || n === 'gasoil') Gestion.mostrar(n);
  if (['mant', 'alq', 'seg', 'pers', 'bi'].includes(n)) Gestion2.mostrar(n);
  if (n === 'cert') Certificado.mostrar();
  if (n === 'minutas') Minutas.mostrar();
  window.scrollTo(0, 0);
}
function abrirModal(titulo, html) {
  $('modal').querySelector('.modal-card').classList.remove('ancho');
  $('modal-titulo').textContent = titulo;
  $('modal-cuerpo').innerHTML = html;
  $('modal').classList.add('show');
}
function cerrarModal() { $('modal').classList.remove('show'); }
let toastTimer;
function toast(msg, tipo) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + (tipo || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 3200);
}
function mostrarCarga(txt) { $('loading-text').textContent = txt || 'Cargando…'; $('loading').classList.add('show'); }
function ocultarCarga() { $('loading').classList.remove('show'); }

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('modal').classList.contains('show')) cerrarModal();
  else if ($('hoja').classList.contains('show')) cerrarFicha();
});
